[tox]
envlist = python
minversion = 3.2
# https://github.com/jaraco/skeleton/issues/6
tox_pip_extensions_ext_venv_update = true
toxworkdir={env:TOX_WORK_DIR:.tox}

[testenv]
deps =
	# Anchor the release-era pytest stack. Resolving it from the `testing` extra
	# alone is unstable: on the Windows legs pip backtracks all the way to
	# pytest 3.5.1 / pluggy 0.6.0 / pytest-xdist 1.24.1, a combination that
	# cannot run this suite at all (every xdist worker aborts at startup with
	# "Plugin already registered: _cov" because pytest-enabler re-registers
	# pytest-cov on that ancient pluggy). These are the versions the Linux and
	# macOS legs resolve on their own.
	pytest==6.2.1
	pluggy==0.13.1
	pytest-cov==2.11.1
	pytest-xdist==2.2.0
	pytest-forked==1.3.0
	# pytest's own win32-only dependency; named explicitly because its absence
	# from the index snapshot is what triggered that backtrack.
	atomicwrites==1.4.0; sys_platform == "win32"
commands =
	pytest {posargs}
usedevelop = True
extras = testing
install_command = {[helpers]pip} install {opts} {packages}
list_dependencies_command = {[helpers]pip} freeze --all
setenv =
	COVERAGE_FILE={toxworkdir}/.coverage.{envname}
passenv =
	windir  # required for test_pkg_resources
	CFLAGS  # needed to build this era's typed-ast on arm64 macOS
	PIP_INDEX_URL  # release-era index, set only for the dependency install
	PIP_FIND_LINKS  # supplies atomicwrites, which that index lacks
	PYTEST_XDIST_AUTO_NUM_WORKERS  # caps `-n auto` on memory-tight runners

[testenv:coverage]
description=Combine coverage data and create report
deps=coverage
skip_install=True
changedir={toxworkdir}
setenv=COVERAGE_FILE=.coverage
commands=coverage erase
         coverage combine
         coverage {posargs:xml}

[testenv:codecov]
description=[Only run on CI]: Upload coverage data to codecov
deps=codecov
skip_install=True
commands=codecov -X gcov --file {toxworkdir}/coverage.xml

[testenv:docs]
extras =
	docs
	testing
changedir = docs
commands =
	python -m sphinx -W . {toxinidir}/build/html

[testenv:finalize]
skip_install = True
deps =
	towncrier
	bump2version
passenv = *
commands =
	python tools/finalize.py

[testenv:release]
skip_install = True
deps =
	build
	twine[keyring]>=1.13
	path
	jaraco.develop>=7.1
	jaraco.tidelift
passenv =
	TWINE_PASSWORD
	GITHUB_TOKEN
	TIDELIFT_TOKEN
setenv =
	TWINE_USERNAME = {env:TWINE_USERNAME:__token__}
commands =
	python -m bootstrap
	python -c "import path; path.Path('dist').rmtree_p()"
	# unset tag_build and tag_date pypa/setuptools#2500
	python setup.py egg_info -Db "" saveopts
	python -m build
	python -m twine upload dist/*
	python -m jaraco.develop.create-github-release
	python -m jaraco.tidelift.publish-release-notes

[helpers]
# Custom pip behavior
pip = python {toxinidir}/tools/tox_pip.py
